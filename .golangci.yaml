version: "2"
run:
  concurrency: 8
  tests: false
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: false
  path-prefix: ""
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - nakedret
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - whitespace
    - wsl
  settings:
    gocyclo:
      min-complexity: 8
    lll:
      line-length: 120
    revive:
      confidence: 0.8
      severity: error
      rules:
        - name: atomic
          severity: warning
        - name: package-comments
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - disableStutteringCheck
          severity: warning
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: argument-limit
          arguments:
            - 6
        - name: function-result-limit
          arguments:
            - 3
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: unnecessary-stmt
        - name: struct-tag
        - name: atomic
        - name: empty-lines
        - name: duplicated-imports
        - name: import-shadowing
        - name: confusing-results
        - name: modifies-parameter
        - name: redefines-builtin-id
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: '^//go:generate '
    paths:
      - _test.go
      - _mock.go
      - .*\.pb\.go
      - .*\.gen\.go
      - test
      - third_party
      - third_party$
      - builtin$
      - examples$
issues:
  fix: true
severity:
  default: error
  rules:
    - linters:
        - revive
      severity: error
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - _test.go
      - _mock.go
      - .*\.pb\.go
      - .*\.gen\.go
      - test
      - third_party
      - third_party$
      - builtin$
      - examples$
